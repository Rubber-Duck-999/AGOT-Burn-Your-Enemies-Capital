 agot_burn_your_enemies_dragon_raid_capital_interaction:0 "Burn Capital"
 agot_burn_your_enemies_dragon_raid_capital_interaction_desc:0 "Mount your dragon and fly directly to the capital of this ruler to lay waste to their holdings."
 agot_burn_your_enemies_capital_already_ruined:0 "This capital is already a ruin."
 agot_burn_your_enemies_actor_vengeful_trait:0 "You must have the Vengeful, Wrathful or Brave trait."
 agot_burn_your_enemies_actor_at_war:0 "You are currently at war."
 agot_burn_your_enemies_actor_travelling:0 "You are currently travelling."
 agot_burn_your_enemies_actor_is_imprisoned:0 "You are currently imprisoned."
 agot_burn_your_enemies_actor_cooldown:0 "You recently burned a capital and must wait before using this again."
 agot_burn_your_enemies_actor_no_dragon:0 "You do not currently have a dragon."
 agot_burn_your_enemies_recipient_at_war:0 "This ruler is currently at war."
 agot_burn_your_enemies_receipient_is_imprisoned:0 "This ruler is currently imprisoned."
 agot_burn_your_enemies_recipient_travelling:0 "This ruler is currently travelling."
 agot_burn_your_enemies_not_allied:0 "You cannot burn the capital of an ally."
 agot_burn_your_enemies_no_truce:0 "You cannot burn the capital of someone with whom you have a truce."
 agot_burn_your_enemies_not_in_your_realm:0 "You cannot burn the capital of someone in your realm."

 agot_burn_your_enemies_dragon_burned_devastation:0 "Dragon Devastation"
 agot_burn_your_enemies_dragon_burned_devastation_desc:0 "This county was recently burned by dragonfire, destroying infrastructure and terrifying the populace."

 agot_burn_your_enemies_holding_dragon_scathed:0 "Dragon Scathed Castle"
 agot_burn_your_enemies_holding_dragon_scathed_desc:0 "The walls and garrisons of this holding were melted and scattered by dragonfire."

 agot_burn_your_enemies_dragon_raid.0001.t:0 "The Flight Ends"
 agot_burn_your_enemies_dragon_raid.0001.desc:0 "After days in the sky, [agot_burn_your_enemies_my_dragon.GetName] circles high above [agot_burn_your_enemies_target_capital_county.GetName]. Much can change in the course of a long flight."
 agot_burn_your_enemies_dragon_raid.0001.proceed:0 "Dracarys. Begin the attack."
 agot_burn_your_enemies_dragon_raid.0001.aborted:0 "The moment has passed. Turn back."

 agot_burn_your_enemies_dragon_raid.0002.t:0 "Burn Your Enemies Capital"
 agot_burn_your_enemies_dragon_raid.0002.desc:0 "Below me lies [agot_burn_your_enemies_target_capital_county.GetName], seat of power of [agot_burn_your_enemies_target.GetName]. [agot_burn_your_enemies_my_dragon.GetName] and I have travelled far enough.\n\nShall I unleash dragonfire and reduce it to ruin?"
 agot_burn_your_enemies_dragon_raid.0002.minor:0 "Scorch [agot_burn_your_enemies_target_capital_county.GetName]"
 agot_burn_your_enemies_dragon_raid.0002.major:0 "Burn [agot_burn_your_enemies_target_capital_county.GetName]"
 agot_burn_your_enemies_dragon_raid.0002.ruin:0 "Dracarys! Reduce [agot_burn_your_enemies_target_capital_county.GetName] to ruins!"
 agot_burn_your_enemies_dragon_raid.0002.cancel:0 "Turn back... (let's hope we don't get shamed for this)"
 agot_burn_your_enemies_dragon_raid.0002.desc.variant2:0 "[agot_burn_your_enemies_target_capital_county.GetName] has no warning beyond a shadow crossing the sun - then [agot_burn_your_enemies_my_dragon.GetName]'s roar drowns out every bell in the city.\n\nShall I unleash dragonfire and reduce it to ruin?"
 agot_burn_your_enemies_dragon_raid.0002.desc.variant3:0 "I circle once above [agot_burn_your_enemies_target_capital_county.GetName], watching [agot_burn_your_enemies_target.GetName]'s defenders scramble for their scorpions below.\n\nShall I unleash dragonfire and reduce it to ruin?"

 agot_burn_your_enemies_dragon_raid.0003.t:0 "After the Dragonfire"
 agot_burn_your_enemies_dragon_raid.0003.desc:0 "Dragonfire rained down upon [agot_burn_your_enemies_target_capital_county.GetName]. Towers cracked, garrisons scattered, and the capital bears the scars of the attack."
 agot_burn_your_enemies_dragon_raid.0003.a:0 "Let all who oppose me burn."

 agot_burn_your_enemies_dragon_raid_event.0003.t:0 "Repelled by Defenses"
 agot_burn_your_enemies_dragon_raid_event.0003.desc:0 "As [agot_burn_your_enemies_my_dragon.GetName] circled above [recipient.GetCapitalLocation.GetName], scorpion bolts and archers filled the sky. The castle defenses proved too formidable, forcing a retreat and leaving us wounded."
 agot_burn_your_enemies_dragon_raid_event.0003.a:0 "Curse their archers!"

 agot_burn_your_enemies_dragon_raid.0005.t:0 "A Wounded Dragon"
 agot_burn_your_enemies_dragon_raid.0005.desc:0 "[agot_burn_your_enemies_my_dragon.GetName] roars in pain as a scorpion bolt finds its mark, tearing through wing and scale. Blood rains down over [agot_burn_your_enemies_target_capital_county.GetName] as we fight to stay aloft."
 agot_burn_your_enemies_dragon_raid.0005.a:0 "It will heal, in time."

 agot_burn_your_enemies_dragon_raid.0006.a:0 "OK"

 agot_burn_your_enemies_dragon_raid.0007.t:0 "Word from the Ashes"
 agot_burn_your_enemies_dragon_raid.0007.desc:0 "Years after the flames died down, word reaches you: the capital you burned to ruin has been rebuilt. Life goes on, even in the shadow of dragons."
 agot_burn_your_enemies_dragon_raid.0007.pride:0 "Let them remember what I can do"
 agot_burn_your_enemies_dragon_raid.0007.regret:0 "At least something good came of it"

 agot_burn_your_enemies_dragon_raid.0008.t:0 "A Dragon Falls"
 agot_burn_your_enemies_dragon_raid.0008.desc:0 "The scorpion bolts find their mark again and again. [agot_burn_your_enemies_my_dragon.GetName] shrieks once, then falls from the sky like a burning star."
 agot_burn_your_enemies_dragon_raid.0008.a:0 "No..."

 agot_burn_your_enemies_dragon_raid.0009.t:0 "Dragon Duel"
 agot_burn_your_enemies_dragon_raid.0009.desc:0 "Another dragon rises to meet us over [agot_burn_your_enemies_target_capital_county.GetName], its rider screaming a challenge. There will be no burning this capital until it's dealt with."
 agot_burn_your_enemies_dragon_raid.0009.a:0 "Lets battle in the skies!"

 agot_burn_your_enemies_target_cooldown:0 "This capital was raided too recently"

 agot_burn_your_enemies_capital_burned_memory:0 "My capital was put to the torch by a dragon."
 agot_burn_your_enemies_burned_a_capital_memory:0 "I burned an enemy's capital to ash with dragonfire."

 agot_burn_your_enemies_atrocity_opinion:0 "Burned an Enemy's Capital"

 artifact_agot_burn_your_enemies_skull_trophy_type:0 "Skull Trophy"
 agot_burn_your_enemies_skull_trophy_name:0 "Skull of [recipient.GetNameNoTooltip]"
 agot_burn_your_enemies_skull_trophy_desc:0 "The blackened skull of [recipient.GetNameNoTooltip], claimed from the ashes of [recipient.GetCapitalLocation.GetName] after [agot_burn_your_enemies_my_dragon.GetName] put it to the torch."

 agot_burn_your_enemies_dragon_raid.0011.t:0 "A Grim Trophy"
 agot_burn_your_enemies_dragon_raid.0011.desc:0 "The skull of [recipient.GetNameNoTooltip] sits before me, cleaned of ash and flesh by [agot_burn_your_enemies_my_dragon.GetName]'s fire. Some lords keep such things as a warning to their enemies. Others see only the making of new ones."
 agot_burn_your_enemies_dragon_raid.0011.keep:0 "Keep it."
 agot_burn_your_enemies_dragon_raid.0011.destroy:0 "Destroy it."

