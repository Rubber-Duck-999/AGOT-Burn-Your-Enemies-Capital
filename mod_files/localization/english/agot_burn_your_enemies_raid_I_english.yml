l_english:
 agot_burn_your_enemies_dragon_raid.0001.t:0 "The Flight Ends"
 agot_burn_your_enemies_dragon_raid.0001.desc:0 "After days in the sky, [agot_burn_your_enemies_my_dragon.GetName] circles high above [agot_burn_your_enemies_target_capital_county.GetName]. Much can change in the course of a long flight."
 agot_burn_your_enemies_dragon_raid.0001.proceed:0 "Dracarys. Begin the attack."
 agot_burn_your_enemies_dragon_raid.0001.aborted:0 "The moment has passed. Turn back."

 agot_burn_your_enemies_dragon_raid.0002.t:0 "Burn Your Enemies Capital"
 agot_burn_your_enemies_dragon_raid.0002.desc:0 "Below me lies [agot_burn_your_enemies_target_capital_county.GetName], seat of power of [agot_burn_your_enemies_target.GetName]. [agot_burn_your_enemies_my_dragon.GetName] and I have travelled far enough.\n\nShall I unleash dragonfire and reduce it to ruin?"
 agot_burn_your_enemies_dragon_raid.0002.minor:0 "Scorch [agot_burn_your_enemies_target_capital_county.GetName]"
 agot_burn_your_enemies_dragon_raid.0002.major:0 "Burn [agot_burn_your_enemies_target_capital_county.GetName]"
 agot_burn_your_enemies_dragon_raid.0002.ruin:0 "Dracarys! Reduce [agot_burn_your_enemies_target_capital_county.GetName] to ruins!"
 agot_burn_your_enemies_dragon_raid.0002.cancel:0 "Turn back... (let's hope we don't get shamed for this)"

 agot_burn_your_enemies_dragon_raid.0003.t:0 "After the Dragonfire"
 agot_burn_your_enemies_dragon_raid.0003.desc:0 "Dragonfire rained down upon [agot_burn_your_enemies_target_capital_county.GetName]. Towers cracked, garrisons scattered, and the capital bears the scars of the attack."
 agot_burn_your_enemies_dragon_raid.0003.a:0 "Let all who oppose me burn."

 agot_burn_your_enemies_dragon_raid_event.0003.t:0 "Repelled by Defenses"
 agot_burn_your_enemies_dragon_raid_event.0003.desc:0 "As [agot_burn_your_enemies_my_dragon.GetName] circled above [recipient.GetCapitalLocation.GetName], scorpion bolts and archers filled the sky. The castle defenses proved too formidable, forcing a retreat and leaving us wounded."
 agot_burn_your_enemies_dragon_raid_event.0003.a:0 "Curse their archers!"

 agot_burn_your_enemies_dragon_raid.0005.t:0 "A Wounded Dragon"
 agot_burn_your_enemies_dragon_raid.0005.desc:0 "[agot_burn_your_enemies_my_dragon.GetName] roars in pain as a scorpion bolt finds its mark, tearing through wing and scale. Blood rains down over [agot_burn_your_enemies_target_capital_county.GetName] as we fight to stay aloft."
 agot_burn_your_enemies_dragon_raid.0005.a:0 "It will heal, in time."