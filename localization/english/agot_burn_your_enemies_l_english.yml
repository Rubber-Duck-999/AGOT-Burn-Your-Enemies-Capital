l_english:
 agot_burn_your_enemies_dragon_raid_capital_interaction:0 "Burn Capital"
 agot_burn_your_enemies_dragon_raid_capital_interaction_desc:0 "Mount your dragon and fly directly to the capital of this ruler to lay waste to their holdings."
 agot_burn_your_enemies_capital_already_ruined:0 "This capital is already a ruin."
 agot_burn_your_enemies_actor_at_war:0 "You are currently at war."
 agot_burn_your_enemies_actor_travelling:0 "You are currently travelling."
 agot_burn_your_enemies_recipient_at_war:0 "This ruler is currently at war."
 agot_burn_your_enemies_recipient_travelling:0 "This ruler is currently travelling."
 agot_burn_your_enemies_no_court_dragonrider:0 "There are dragonriders in this court."
 
 agot_burn_your_enemies_dragon_burned_devastation:0 "Dragon Devastation"
 agot_burn_your_enemies_dragon_burned_devastation_desc:0 "This county was recently burned by dragonfire, destroying infrastructure and terrifying the populace."
 
 agot_burn_your_enemies_holding_dragon_scathed:0 "Dragon Scathed Castle"
 agot_burn_your_enemies_holding_dragon_scathed_desc:0 "The walls and garrisons of this holding were melted and scattered by dragonfire."
 
 agot_burn_your_enemies_dragon_raid.0001.t:0 "Burn Your Enemies Capital: Fly to [agot_burn_your_enemies_target_capital_county.GetName]"
 agot_burn_your_enemies_dragon_raid.0001.desc:0 "I mount [agot_burn_your_enemies_my_dragon.GetName] and take to the skies, soaring over borders toward the capital of [recipient.GetTitledName]. Below lies their seat of power, [agot_burn_your_enemies_target_capital_county.GetName].\n\nShall I unleash dragonfire and reduce it to ruin?"
 agot_burn_your_enemies_dragon_raid.0001.minor:0 "Scorch [agot_burn_your_enemies_target_capital_county.GetName]"
 agot_burn_your_enemies_dragon_raid.0001.major:0 "Burn [agot_burn_your_enemies_target_capital_county.GetName]"
 agot_burn_your_enemies_dragon_raid.0001.ruin:0 "Dracarys! Reduce [agot_burn_your_enemies_target_capital_county.GetName] to ruins!"
 agot_burn_your_enemies_dragon_raid.0001.cancel:0 "Turn back..."
 
 agot_burn_your_enemies_dragon_raid.0002.t:0 "After the Dragonfire"
 agot_burn_your_enemies_dragon_raid.0002.desc:0 "Dragonfire rained down upon [agot_burn_your_enemies_target_capital_county.GetName]. Towers cracked, garrisons scattered, and the capital bears the scars of the attack."
 agot_burn_your_enemies_dragon_raid.0002.a:0 "Let all who oppose me burn."
 
 agot_burn_your_enemies_dragon_raid_event.0003.t:0 "Repelled by Defenses"
 agot_burn_your_enemies_dragon_raid_event.0003.desc:0 "As we closed in on [recipient.GetCapitalLocation.GetName], scorpion bolts and archers filled the sky. The castle defenses proved too formidable, forcing a retreat and leaving us wounded."
 agot_burn_your_enemies_dragon_raid_event.0003.a:0 "Curse their archers!"