 agot_burn_your_enemies_dragon_raid_capital_interaction:0 "Burn Capital"
 agot_burn_your_enemies_dragon_raid_capital_interaction_desc:0 "Mount your dragon and fly directly to the capital of this ruler to lay waste to their holdings."
